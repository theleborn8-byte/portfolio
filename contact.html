<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THELWEN | CONTACT</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;800&family=Syne:wght@700;800&family=Inter:wght@200;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    
    <script>
        if (localStorage.getItem('theme') === 'light') {
            document.documentElement.classList.add('light-mode');
        }
    </script>
</head>
<body>

    <div class="ambient-laser"></div>
    <div class="structural-grid-line line-left"></div>
    <div class="structural-grid-line line-right"></div>

    <header class="navbar">
        <div class="logo">Thelwen</div>
        <div class="nav-links">
            <a href="index.html"><span class="nav-num"></span> Projets</a>
            <a href="contact.html" class="active"><span class="nav-num"></span> Contact</a>
            <button id="theme-toggle" class="theme-btn">MODE: <span id="theme-label">DARK</span></button>
        </div>
    </header>

    <main class="viewport-canvas">
        <div class="contact-section">
            <h1 class="title-contact">ME <span class="gold-gradient-text">CONTACTER</span></h1>
            
            <form action="https://formspree.io/f/mqeokdyr" method="POST" class="contact-form">
                
                <div class="form-group">
                    <label for="name">Nom / Entreprise</label>
                    <input type="text" id="name" name="name" required placeholder="Ex: Jean Dupont">
                </div>

                <div class="form-group">
                    <label for="email">Adresse E-mail</label>
                    <input type="email" id="email" name="_replyto" required placeholder="Ex: jean.dupont@email.com">
                </div>

                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="6" required placeholder="Votre message..."></textarea>
                </div>

                <input type="text" name="_gotcha" style="display:none">

                <button type="submit" class="btn-primary">Envoyer la spécification</button>
            </form>
        </div>
    </main>

    <footer class="editorial-footer">
        <div class="footer-line"></div>
        <div class="footer-content">
            <span>THELWEN 2026</span>
            <span>TOUT DROIT RÉSERVÉ ©</span>
        </div>
    </footer>

    <script>
        const toggleBtn = document.getElementById('theme-toggle');
        const themeLabel = document.getElementById('theme-label');
        const html = document.documentElement;

        if (html.classList.contains('light-mode')) {
            themeLabel.textContent = 'LIGHT';
        }

        toggleBtn.addEventListener('click', () => {
            html.classList.toggle('light-mode');
            if (html.classList.contains('light-mode')) {
                localStorage.setItem('theme', 'light');
                themeLabel.textContent = 'LIGHT';
            } else {
                localStorage.setItem('theme', 'dark');
                themeLabel.textContent = 'DARK';
            }
        });
    </script>
</body>
</html>
