<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio | Contact</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="navbar">
        <div class="logo">Mon Portfolio</div>
        <nav>
            <a href="index.html">Mes Projets</a>
            <a href="contact.html" class="active">Contact</a>
        </nav>
    </header>

    <main class="container">
        <section class="contact-section">
            <div style="text-align: center;">
                <h1>Me Contacter</h1>
                <p>Envoyez-moi un message directement via ce formulaire.</p>
            </div>
            
            <!-- Remplace l'URL de l'action par celle fournie par Formspree -->
            <form action="https://formspree.io/f/TON_CODE_FORMSPREE" method="POST" class="contact-form">
                
                <div class="form-group">
                    <label for="name">Votre Nom</label>
                    <input type="text" id="name" name="name" required placeholder="Jean Dupont">
                </div>

                <div class="form-group">
                    <label for="email">Votre Email</label>
                    <input type="email" id="email" name="email" required placeholder="jean@email.com">
                </div>

                <div class="form-group">
                    <label for="message">Votre Message</label>
                    <textarea id="message" name="message" rows="5" required placeholder="Bonjour, je vous contacte pour..."></textarea>
                </div>

                <button type="submit" class="btn-primary">Envoyer le message</button>
            </form>
        </section>
    </main>

    <footer><p>&copy; 2026 - Portfolio codé à la main</p></footer>
</body>
</html>
